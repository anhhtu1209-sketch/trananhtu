; Bai 1: so sanh 3 cach tao nhip dinh ky. Moi vi du la 1 env.
; Pin platform 6.5.0 (Arduino-ESP32 core 2.0.x) vi timerBegin(0,80,true) la API core 2.x.
[platformio]
default_envs = vd2_millis

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:vd1_delay]
build_src_filter = -<*> +<vd1_delay.cpp>

[env:vd2_millis]
build_src_filter = -<*> +<vd2_millis.cpp>

[env:vd3_hwtimer]
build_src_filter = -<*> +<vd3_hwtimer.cpp>
