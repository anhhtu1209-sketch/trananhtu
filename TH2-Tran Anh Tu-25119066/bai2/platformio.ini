[platformio]
default_envs = vd1_bien_giu

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:vd1_bien_giu]
build_src_filter = -<*> +<vd1_bien_giu.cpp>

[env:vd2_thuc_day]
build_src_filter = -<*> +<vd2_thuc_day.cpp>

[env:vd3_cac_che_do]
build_src_filter = -<*> +<vd3_cac_che_do.cpp>
